<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 326" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">How the Family Daily works</title>
  <desc id="diagram-desc">Selected calendar, email, chat, and weather information goes to your Mac. The Mac prepares a newspaper image for a PNG preview and, optionally, an e-ink frame.</desc>
  <rect width="760" height="326" rx="10" fill="#f7f3eb"/>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3d4a3a"/>
    </marker>
  </defs>
  <g fill="none" stroke="#3d4a3a" stroke-width="2" marker-end="url(#arrow)">
    <path d="M226 151 H268"/>
    <path d="M490 151 H520 V81 H548"/>
    <path d="M520 151 V227 H548"/>
  </g>
  <g stroke="#b7ad9b" stroke-width="1.5">
    <rect x="16" y="39" width="210" height="224" rx="8" fill="#fffdf8"/>
    <rect x="270" y="79" width="220" height="144" rx="8" fill="#efe9de" stroke="#3d4a3a"/>
    <rect x="550" y="35" width="194" height="92" rx="8" fill="#fffdf8"/>
    <rect x="550" y="181" width="194" height="92" rx="8" fill="#fffdf8"/>
  </g>
  <g fill="#1a1a1a" font-family="Georgia, serif" text-anchor="middle">
    <text x="121" y="76" font-size="21" font-weight="700">Selected sources</text>
    <line x1="38" y1="91" x2="204" y2="91" stroke="#d9d0c0"/>
    <text x="121" y="122" font-size="19">Family calendar</text>
    <text x="121" y="158" font-size="19">Email</text>
    <text x="121" y="194" font-size="19">Family messages</text>
    <text x="121" y="230" font-size="19">Weather</text>
    <text x="380" y="123" font-size="27" font-weight="700">Your Mac</text>
    <text x="380" y="162" font-size="21">prepares your</text>
    <text x="380" y="192" font-size="21">newspaper</text>
    <text x="647" y="75" font-size="23" font-weight="700">PNG preview</text>
    <text x="647" y="104" font-size="17" fill="#5a554c">View on the Mac</text>
    <text x="647" y="221" font-size="23" font-weight="700">E-ink frame</text>
    <text x="647" y="250" font-size="17" fill="#5a554c">Optional wall display</text>
    <text x="380" y="306" font-size="18" fill="#5a554c">A fresh edition on the schedule you choose.</text>
  </g>
</svg>
